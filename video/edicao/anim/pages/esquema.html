<div class="card" id="cap"><div id="bar"></div><div class="ct" id="ct"></div><div class="cs" id="cs"></div></div>
<script src="common.js"></script>
<script>
const {dur, B} = setupAnim('esquema', 14, {sensor: 0.4, pwm: 3.8, potencia: 7.4, terra: 10.6});
const steps = [
  {t: 'sensor', c: '#2478C8', ti: '1 · Sensor → GPIO4', su: 'o ESP32 lê o sensor de forma analógica', cam: [560, 556, 1.28], f: ['f1']},
  {t: 'pwm', c: '#8656B9', ti: '2 · GPIO21 → 220 Ω → gate (G)', su: '10 kΩ do gate ao GND', cam: [1390, 680, 1.6], f: ['f2']},
  {t: 'potencia', c: '#D54343', ti: '3 · +12 V → ventoinha → dreno (D)', su: 'a ventoinha usa a fonte de 12 V', cam: [1410, 570, 1.25], f: ['f3']},
  {t: 'terra', c: '#5B6B80', ti: '4 · Source (S) no GND comum', su: 'ESP32 (pela USB), fonte de 12 V e sensor', cam: [960, 547, 0.97], f: ['f4a', 'f4b']},
];
const els = [...document.querySelectorAll('[data-s]')].map(e => [e, e.dataset.s.split(' ').map(Number)]);
const flows = {};
['f1', 'f2', 'f3', 'f4a', 'f4b'].forEach(id => { const e = $(id); flows[id] = e; e.style.strokeDasharray = '26 30'; });
const CAM0 = [960, 547, 0.97];
const cy0 = 535; // centro vertical da área útil (abaixo da legenda)
window.render = t => {
  // passo ativo e transição
  let k = -1; steps.forEach((s, i) => { if (t >= B[s.t]) k = i; });
  const camA = k <= 0 ? CAM0 : steps[k - 1].cam;
  const camB = k < 0 ? CAM0 : steps[k].cam;
  const u = k < 0 ? 0 : prog(t, B[steps[k].t], 1.2);
  const cx = lerp(camA[0], camB[0], u), cy = lerp(camA[1], camB[1], u), s = lerp(camA[2], camB[2], u);
  $('cam').setAttribute('transform', `translate(960 ${cy0}) scale(${s}) translate(${-cx} ${-cy})`);
  // esmaecimento
  const dimU = k < 0 ? 0 : (k === 0 ? u : 1);
  els.forEach(([e, ss]) => {
    const on = k >= 0 && ss.includes(k + 1);
    const wasOn = k >= 1 && ss.includes(k);
    const a = k === 0 ? (on ? 1 : lerp(1, .25, u)) : (k < 0 ? 1 : lerp(wasOn ? 1 : .25, on ? 1 : .25, u));
    e.style.opacity = a;
  });
  // fluxos
  for (const id in flows) flows[id].style.opacity = 0;
  if (k >= 0) steps[k].f.forEach(id => {
    flows[id].style.opacity = .28 * prog(t, B[steps[k].t] + .6, .6);
    flows[id].style.strokeDashoffset = -t * 70;
  });
  // legenda
  const cap = $('cap');
  if (k < 0) { cap.style.opacity = 0; return; }
  const st = steps[k];
  $('ct').textContent = st.ti; $('cs').textContent = st.su; $('bar').style.background = st.c;
  const nxt = k + 1 < steps.length ? B[steps[k + 1].t] : 1e9;
  const a = Math.min(prog(t, B[st.t], .5), 1 - prog(t, nxt - .3, .3));
  $('ct').style.opacity = $('cs').style.opacity = a;
  cap.style.opacity = prog(t, B.sensor, .5);
};
render(0);
</script></body></html>
