<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;padding:0;background:#F4F6FA;overflow:hidden;width:1920px;height:1080px}
canvas{display:block}
#lbl{position:absolute;left:56px;top:48px;font-family:Inter,sans-serif;font-weight:600;font-size:40px;color:#1B2A41;
 background:#FFFFFF;border-radius:16px;padding:14px 28px;box-shadow:0 2px 10px rgba(27,42,65,.08)}
#lbl span{color:#5B6B80;font-weight:500}
#leg{transition:none;position:absolute;left:56px;top:136px;font-family:Inter,sans-serif;font-weight:500;font-size:32px;color:#5B6B80;display:none;align-items:center;gap:14px}
#leg i{display:inline-block;width:28px;height:28px;border-radius:8px;background:#E8A35C}
</style></head><body>
<div id="lbl">Modelo 3D do suporte <span>(peça integral)</span></div>
<div id="leg"><i></i>cavidade do sensor</div>
<script type="importmap">{"imports":{"three":"./three.module.js"}}</script>
<script type="module">
import * as THREE from './three.module.js';
import { STLLoader } from './node_modules/three/examples/jsm/loaders/STLLoader.js';

const W=1920,H=1080;
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(W,H);
renderer.setClearColor(0xF4F6FA,1);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(26,W/H,10,2000);

scene.add(new THREE.HemisphereLight(0xFFFFFF,0xA9B4C4,1.5));
const key=new THREE.DirectionalLight(0xFFFFFF,2.3);
key.position.set(-140,200,230);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);key.shadow.radius=6;key.shadow.bias=-0.0006;key.shadow.normalBias=0.4;
Object.assign(key.shadow.camera,{left:-80,right:80,top:80,bottom:-80,near:10,far:600});
scene.add(key);
const fill=new THREE.DirectionalLight(0xDDE6F2,0.7);fill.position.set(200,60,-120);scene.add(fill);
const rim=new THREE.DirectionalLight(0xFFFFFF,0.5);rim.position.set(0,120,-250);scene.add(rim);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(800,800),new THREE.ShadowMaterial({opacity:0.13}));
ground.rotation.x=-Math.PI/2;ground.position.y=-42.45-0.3;ground.receiveShadow=true;scene.add(ground);

const pivot=new THREE.Group();scene.add(pivot);
const inner=new THREE.Group();inner.rotation.y=Math.PI;pivot.add(inner); // sensor side (-Z do STL) virado para a câmera em theta=0

const loader=new STLLoader();
const load=u=>new Promise(r=>loader.load(u,r));
const params=new URLSearchParams(location.search);
const hl=params.get('hl')!=='0';
Promise.all([load('main.stl'),load('cavity.stl')]).then(([g1,g2])=>{
  const matMain=new THREE.MeshStandardMaterial({color:0x4F6A86,roughness:0.85,metalness:0.0,flatShading:false});
  const matCav=new THREE.MeshStandardMaterial({color:hl?0xF0A050:0x4F6A86,roughness:0.85,metalness:0,emissive:hl?0x7a3a00:0x000000,emissiveIntensity:0.35});
  for(const [g,m] of [[g1,matMain],[g2,matCav]]){
    g.computeVertexNormals();
    const mesh=new THREE.Mesh(g,m);mesh.castShadow=true;mesh.receiveShadow=true;inner.add(mesh);
    const e=new THREE.LineSegments(new THREE.EdgesGeometry(g,30),new THREE.LineBasicMaterial({color:0x2E4258,transparent:true,opacity:0.55}));
    inner.add(e);
  }
  if(hl) document.getElementById('leg').style.display='flex';
  window.ready=true;
});

const target=new THREE.Vector3(0,-11,0);
window.setView=(theta,elev=17,dist=300)=>{
  pivot.rotation.y=theta*Math.PI/180;
  const el=elev*Math.PI/180;
  cam.position.set(0,target.y+dist*Math.sin(el),dist*Math.cos(el));
  cam.lookAt(target);
  renderer.render(scene,cam);
};
window.setLegend=o=>{document.getElementById('leg').style.opacity=o};
</script></body></html>
