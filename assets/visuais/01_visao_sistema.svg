<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>AeroLab · medir, decidir e acionar</title><rect width="1920" height="1080" fill="#f5f7fb"/><g font-family="DejaVu Sans, sans-serif"><text xml:space="preserve" x="70" y="90" font-size="46" fill="#172b43" font-weight="700">AeroLab · medir, decidir e acionar</text><text xml:space="preserve" x="70" y="142" font-size="24" fill="#5b6d80" font-weight="400">Visão funcional do projeto — controle realimentado de velocidade</text><g id="medir"><rect x="70" y="245" width="540" height="385" rx="22" fill="white" stroke="#d8e0eb" stroke-width="2"/><text xml:space="preserve" x="104" y="300" font-size="22" fill="#2478c8" font-weight="700">MEDIR</text><text xml:space="preserve" x="104" y="380" font-size="44" fill="#172b43" font-weight="700">TCRT5000</text><text xml:space="preserve" x="104" y="452" font-size="27" fill="#172b43" font-weight="400">Uma marca → um pulso</text><text xml:space="preserve" x="104" y="525" font-size="24" fill="#5b6d80" font-weight="400">GPIO4 · leitura analógica</text></g><g id="decidir"><rect x="690" y="245" width="540" height="385" rx="22" fill="white" stroke="#d8e0eb" stroke-width="2"/><text xml:space="preserve" x="724" y="300" font-size="22" fill="#c66a16" font-weight="700">DECIDIR</text><text xml:space="preserve" x="724" y="380" font-size="44" fill="#172b43" font-weight="700">ESP32</text><text xml:space="preserve" x="724" y="452" font-size="27" fill="#172b43" font-weight="400">Desejado − medido = erro</text><text xml:space="preserve" x="724" y="525" font-size="24" fill="#5b6d80" font-weight="400">Compensação no firmware</text></g><g id="acionar"><rect x="1310" y="245" width="540" height="385" rx="22" fill="white" stroke="#d8e0eb" stroke-width="2"/><text xml:space="preserve" x="1344" y="300" font-size="22" fill="#8656b9" font-weight="700">ACIONAR</text><text xml:space="preserve" x="1344" y="380" font-size="44" fill="#172b43" font-weight="700">IRLZ44N</text><text xml:space="preserve" x="1344" y="452" font-size="27" fill="#172b43" font-weight="400">PWM → ventoinha de 12 V</text><text xml:space="preserve" x="1344" y="525" font-size="24" fill="#5b6d80" font-weight="400">GPIO21 · saída PWM</text></g><polyline points="618,430 678,430" fill="none" stroke="#5b6d80" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><polyline points="661.7919521576518,437.82937961400216 678,430 661.7919521576518,422.17062038599784" fill="none" stroke="#5b6d80" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1238,430 1298,430" fill="none" stroke="#5b6d80" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1281.7919521576518,437.82937961400216 1298,430 1281.7919521576518,422.17062038599784" fill="none" stroke="#5b6d80" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><g id="realimentacao"><polyline points="1580,700 340,700" fill="none" stroke="#2478c8" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><polyline points="356.2080478423482,692.1706203859978 340,700 356.2080478423482,707.8293796140022" fill="none" stroke="#2478c8" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1580,638 1580,700" fill="none" stroke="#2478c8" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><polyline points="340,700 340,638" fill="none" stroke="#2478c8" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><text xml:space="preserve" x="960" y="756" font-size="30" fill="#2478c8" font-weight="600" text-anchor="middle">A velocidade medida retorna ao controlador</text></g><g id="usb"><rect x="630" y="810" width="660" height="110" rx="22" fill="white" stroke="#d8e0eb" stroke-width="2"/><text xml:space="preserve" x="960" y="858" font-size="26" fill="#118b80" font-weight="700" text-anchor="middle">PAINEL LOCAL · USB SERIAL</text><text xml:space="preserve" x="960" y="896" font-size="22" fill="#5b6d80" font-weight="400" text-anchor="middle">Comandos e visualização · 115200 baud</text></g><text xml:space="preserve" x="70" y="1016" font-size="22" fill="#5b6d80" font-weight="400">Diagrama funcional. A interface mostra os dados; a compensação automática acontece no ESP32.</text></g></svg>