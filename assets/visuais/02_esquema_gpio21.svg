<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>Esquema de referência · sensor e acionamento</title><rect width="1920" height="1080" fill="#f5f7fb"/><g font-family="DejaVu Sans, sans-serif"><text xml:space="preserve" x="70" y="90" font-size="46" fill="#172b43" font-weight="700">Esquema de referência · sensor e acionamento</text><text xml:space="preserve" x="70" y="142" font-size="24" fill="#5b6d80" font-weight="400">ESP32 por USB · TCRT5000 avulso em 3,3 V · fonte de 12 V para a ventoinha</text><rect x="64" y="192" width="860" height="710" rx="22" fill="white" stroke="#d8e0eb" stroke-width="2"/><rect x="960" y="192" width="896" height="710" rx="22" fill="white" stroke="#d8e0eb" stroke-width="2"/><text xml:space="preserve" x="98" y="245" font-size="29" fill="#2478c8" font-weight="700">SENSOR AVULSO · GPIO4</text><text xml:space="preserve" x="994" y="245" font-size="29" fill="#8656b9" font-weight="700">ACIONAMENTO · GPIO21</text><g id="circuito_sensor"><polyline points="180,310 700,310" fill="none" stroke="#d54343" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><text xml:space="preserve" x="110" y="320" font-size="25" fill="#d54343" font-weight="700">3V3</text><polyline points="350,310 350,360" fill="none" stroke="#d54343" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><rect x="330" y="360" width="40" height="90" rx="0" fill="#fff2cc" stroke="#a67a14" stroke-width="2"/><polyline points="350,450 350,540" fill="none" stroke="#d54343" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><text xml:space="preserve" x="390" y="415" font-size="25" fill="#172b43" font-weight="400">220 Ω</text><circle cx="350" cy="580" r="40" fill="#cdebf7" stroke="#2478c8" stroke-width="3"/><text xml:space="preserve" x="350" y="588" font-size="25" fill="#2478c8" font-weight="700" text-anchor="middle">IR</text><polyline points="350,620 350,770" fill="none" stroke="#172b43" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><text xml:space="preserve" x="168" y="560" font-size="22" fill="#172b43" font-weight="400">Ânodo (+)</text><text xml:space="preserve" x="160" y="646" font-size="22" fill="#172b43" font-weight="400">Cátodo (−)</text><polyline points="700,310 700,360" fill="none" stroke="#d54343" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><rect x="680" y="360" width="40" height="90" rx="0" fill="#fff2cc" stroke="#a67a14" stroke-width="2"/><polyline points="700,450 700,540" fill="none" stroke="#2478c8" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><text xml:space="preserve" x="750" y="415" font-size="25" fill="#172b43" font-weight="400">10 kΩ</text><circle cx="700" cy="585" r="45" fill="#e5eaf0" stroke="#172b43" stroke-width="3"/><text xml:space="preserve" x="700" y="594" font-size="21" fill="#172b43" font-weight="600" text-anchor="middle">Foto</text><polyline points="700,630 700,770" fill="none" stroke="#172b43" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><polyline points="700,500 835,500" fill="none" stroke="#2478c8" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="700" cy="500" r="7" fill="#2478c8" stroke="none" stroke-width="3"/><text xml:space="preserve" x="795" y="477" font-size="22" fill="#2478c8" font-weight="700" text-anchor="middle">GPIO4</text><text xml:space="preserve" x="548" y="530" font-size="22" fill="#172b43" font-weight="400">Coletor</text><text xml:space="preserve" x="745" y="660" font-size="22" fill="#172b43" font-weight="400">Emissor</text><polyline points="180,770 835,770" fill="none" stroke="#172b43" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><text xml:space="preserve" x="180" y="815" font-size="23" fill="#5b6d80" font-weight="400">GND · mesmo referencial do ESP32</text><polyline points="414,580 640,580" fill="none" stroke="#c66a16" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 9"/><polyline points="623.7919521576518,587.8293796140022 640,580 623.7919521576518,572.1706203859978" fill="none" stroke="#c66a16" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text xml:space="preserve" x="530" y="620" font-size="20" fill="#c66a16" font-weight="400" text-anchor="middle">reflexão</text></g><g id="circuito_mosfet"><text xml:space="preserve" x="1665" y="314" font-size="27" fill="#d54343" font-weight="700" text-anchor="middle">+12 V</text><polyline points="1665,330 1665,372" fill="none" stroke="#d54343" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><rect x="1555" y="372" width="220" height="106" rx="10" fill="#fff" stroke="#172b43" stroke-width="2"/><text xml:space="preserve" x="1665" y="418" font-size="24" fill="#172b43" font-weight="700" text-anchor="middle">VENTOINHA</text><text xml:space="preserve" x="1665" y="455" font-size="22" fill="#5b6d80" font-weight="400" text-anchor="middle">12 V · 2 fios</text><polyline points="1665,478 1665,555" fill="none" stroke="#2478c8" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><rect x="1515" y="555" width="260" height="150" rx="12" fill="#26384c" stroke="#26384c" stroke-width="2"/><text xml:space="preserve" x="1645" y="620" font-size="29" fill="white" font-weight="700" text-anchor="middle">IRLZ44N</text><text xml:space="preserve" x="1535" y="652" font-size="22" fill="white" font-weight="700">G</text><text xml:space="preserve" x="1665" y="580" font-size="22" fill="white" font-weight="700" text-anchor="middle">D</text><text xml:space="preserve" x="1665" y="693" font-size="22" fill="white" font-weight="700" text-anchor="middle">S</text><text xml:space="preserve" x="1004" y="566" font-size="25" fill="#8656b9" font-weight="700">GPIO21</text><polyline points="1010,610 1170,610" fill="none" stroke="#8656b9" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><rect x="1170" y="590" width="105" height="40" rx="0" fill="#fff2cc" stroke="#a67a14" stroke-width="2"/><text xml:space="preserve" x="1222" y="570" font-size="24" fill="#172b43" font-weight="400" text-anchor="middle">220 Ω</text><polyline points="1275,610 1515,610" fill="none" stroke="#8656b9" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1400" cy="610" r="7" fill="#8656b9" stroke="none" stroke-width="3"/><polyline points="1400,610 1400,680" fill="none" stroke="#172b43" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><rect x="1380" y="680" width="40" height="70" rx="0" fill="#fff2cc" stroke="#a67a14" stroke-width="2"/><text xml:space="preserve" x="1326" y="720" font-size="23" fill="#172b43" font-weight="400" text-anchor="end">10 kΩ</text><polyline points="1400,750 1400,805" fill="none" stroke="#172b43" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1665,705 1665,805" fill="none" stroke="#172b43" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1060,805 1790,805" fill="none" stroke="#172b43" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1400" cy="805" r="7" fill="#172b43" stroke="none" stroke-width="3"/><circle cx="1665" cy="805" r="7" fill="#172b43" stroke="none" stroke-width="3"/><text xml:space="preserve" x="1004" y="855" font-size="23" fill="#5b6d80" font-weight="400">GND comum: ESP32 + fonte (−) + sensor + source</text></g><text xml:space="preserve" x="70" y="956" font-size="24" fill="#5b6d80" font-weight="400">Referência atualizada do esquema anterior: GPIO25 → GPIO21. Resistores conforme documentação original.</text><text xml:space="preserve" x="70" y="1016" font-size="22" fill="#5b6d80" font-weight="400">Funções elétricas, não ordem física das pernas. Conferir a montagem real; corrente e aquecimento não caracterizados.</text></g></svg>