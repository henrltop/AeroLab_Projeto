<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>Uma marca transforma passagem em rotação</title><rect width="1920" height="1080" fill="#f5f7fb"/><g font-family="DejaVu Sans, sans-serif"><text xml:space="preserve" x="70" y="90" font-size="46" fill="#172b43" font-weight="700">Uma marca transforma passagem em rotação</text><text xml:space="preserve" x="70" y="142" font-size="24" fill="#5b6d80" font-weight="400">Ilustração conceitual — o rotor desenhado não é um CAD da ventoinha real</text><rect x="70" y="205" width="800" height="715" rx="22" fill="white" stroke="#d8e0eb" stroke-width="2"/><rect x="920" y="205" width="930" height="715" rx="22" fill="white" stroke="#d8e0eb" stroke-width="2"/><g id="rotor_nove_pas"><circle cx="450" cy="550" r="250" fill="#e7edf4" stroke="none" stroke-width="3"/><polygon points="509.3,541.0 667.5,517.1 674.5,619.4 529.8,591.6" fill="#9baec0"/><polygon points="501.2,581.3 637.8,664.6 577.3,747.5 484.4,633.2" fill="#9baec0"/><polygon points="469.1,606.9 520.2,758.5 420.6,783.2 422.9,635.8" fill="#9baec0"/><polygon points="428.1,605.9 369.7,754.8 277.6,709.7 374.1,598.4" fill="#9baec0"/><polygon points="397.3,578.7 256.8,655.3 215.3,561.5 360.8,538.2" fill="#9baec0"/><polygon points="391.2,538.1 234.3,506.5 262.8,408.0 389.2,483.6" fill="#9baec0"/><polygon points="412.6,503.1 312.8,378.1 397.9,320.9 446.1,460.1" fill="#9baec0"/><polygon points="451.5,490.0 455.4,330.1 557.4,341.0 504.8,478.6" fill="#9baec0"/><polygon points="489.7,505.0 595.5,385.0 666.6,458.9 537.9,530.5" fill="#9baec0"/><circle cx="450" cy="550" r="65" fill="#172b43" stroke="none" stroke-width="3"/><rect x="618" y="535" width="42" height="34" rx="3" fill="white" stroke="#627b94" stroke-width="2"/></g><text xml:space="preserve" x="450" y="855" font-size="29" fill="#172b43" font-weight="600" text-anchor="middle">9 pás · só uma marca refletiva</text><g id="pulso"><text xml:space="preserve" x="970" y="296" font-size="25" fill="#2478c8" font-weight="700">CADA VOLTA COMPLETA</text><text xml:space="preserve" x="970" y="368" font-size="43" fill="#172b43" font-weight="700">1 passagem → 1 pulso</text><polyline points="980,550 1120,550 1120,450 1250,450 1250,550 1670,550" fill="none" stroke="#2478c8" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><text xml:space="preserve" x="980" y="625" font-size="27" fill="#5b6d80" font-weight="400">Conta uma borda; espera a marca sair.</text><text xml:space="preserve" x="980" y="714" font-size="31" fill="#172b43" font-weight="600">Exemplo: 30 pulsos em 1 s</text><text xml:space="preserve" x="980" y="778" font-size="42" fill="#c66a16" font-weight="700">30 × 60 = 1800 RPM</text><text xml:space="preserve" x="980" y="852" font-size="25" fill="#2478c8" font-weight="600" font-family="DejaVu Sans Mono, monospace">PULSOS_POR_VOLTA = 1</text></g><text xml:space="preserve" x="70" y="1016" font-size="22" fill="#5b6d80" font-weight="400">Exemplo didático. A forma do pulso está simplificada; não representa uma captura do sinal analógico.</text></g></svg>