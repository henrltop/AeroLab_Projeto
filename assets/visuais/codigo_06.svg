<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>Aplicação do PWM</title><rect width="1920" height="1080" fill="#f5f7fb"/><g font-family="DejaVu Sans, sans-serif"><text xml:space="preserve" x="70" y="90" font-size="46" fill="#172b43" font-weight="700">Aplicação do PWM</text><text xml:space="preserve" x="70" y="142" font-size="24" fill="#5b6d80" font-weight="400">Trecho real do firmware principal · código preservado</text><rect x="70" y="205" width="1780" height="720" rx="22" fill="#16263a" stroke="#16263a" stroke-width="2"/><text xml:space="preserve" x="103" y="260" font-size="19" fill="#7e98b0" font-weight="400" font-family="DejaVu Sans Mono, monospace">28</text><text xml:space="preserve" x="170" y="260" font-size="29" fill="#eaf1fa" font-weight="400" font-family="DejaVu Sans Mono, monospace">void ajustarVelocidade(int percentual) {</text><text xml:space="preserve" x="103" y="308" font-size="19" fill="#7e98b0" font-weight="400" font-family="DejaVu Sans Mono, monospace">29</text><text xml:space="preserve" x="170" y="308" font-size="29" fill="#eaf1fa" font-weight="400" font-family="DejaVu Sans Mono, monospace">  potencia = percentual;</text><text xml:space="preserve" x="103" y="356" font-size="19" fill="#7e98b0" font-weight="400" font-family="DejaVu Sans Mono, monospace">30</text><text xml:space="preserve" x="170" y="356" font-size="29" fill="#eaf1fa" font-weight="400" font-family="DejaVu Sans Mono, monospace">  int pwm = map(percentual, 0, 100, 0, 255);</text><text xml:space="preserve" x="103" y="404" font-size="19" fill="#7e98b0" font-weight="400" font-family="DejaVu Sans Mono, monospace">31</text><text xml:space="preserve" x="170" y="404" font-size="29" fill="#eaf1fa" font-weight="400" font-family="DejaVu Sans Mono, monospace">  analogWrite(VENTOINHA, pwm);</text><text xml:space="preserve" x="103" y="452" font-size="19" fill="#7e98b0" font-weight="400" font-family="DejaVu Sans Mono, monospace">32</text><text xml:space="preserve" x="170" y="452" font-size="29" fill="#eaf1fa" font-weight="400" font-family="DejaVu Sans Mono, monospace">  Serial.printf(&quot;PWM ajustado para %d%%\n&quot;, potencia);</text><text xml:space="preserve" x="103" y="500" font-size="19" fill="#7e98b0" font-weight="400" font-family="DejaVu Sans Mono, monospace">33</text><text xml:space="preserve" x="170" y="500" font-size="29" fill="#eaf1fa" font-weight="400" font-family="DejaVu Sans Mono, monospace">}</text><text xml:space="preserve" x="70" y="1016" font-size="22" fill="#5b6d80" font-weight="400">Fonte: firmware/Ventoinha_Percentual_RPM/Ventoinha_Percentual_RPM.ino · linhas 28–33</text></g></svg>