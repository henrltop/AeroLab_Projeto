<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>Compensação automática</title><rect width="1920" height="1080" fill="#f5f7fb"/><g font-family="DejaVu Sans, sans-serif"><text xml:space="preserve" x="70" y="90" font-size="46" fill="#172b43" font-weight="700">Compensação automática</text><text xml:space="preserve" x="70" y="142" font-size="24" fill="#5b6d80" font-weight="400">Trecho real do firmware principal · código preservado</text><rect x="70" y="205" width="1780" height="720" rx="22" fill="#16263a" stroke="#16263a" stroke-width="2"/><text xml:space="preserve" x="103" y="260.0" font-size="19" fill="#7e98b0" font-weight="400" font-family="DejaVu Sans Mono, monospace">35</text><text xml:space="preserve" x="170" y="260.0" font-size="24" fill="#eaf1fa" font-weight="400" font-family="DejaVu Sans Mono, monospace">void controlarRPM(float rpmAtual, unsigned long intervalo) {</text><text xml:space="preserve" x="103" y="294.2105263157895" font-size="19" fill="#7e98b0" font-weight="400" font-family="DejaVu Sans Mono, monospace">36</text><text xml:space="preserve" x="170" y="294.2105263157895" font-size="24" fill="#eaf1fa" font-weight="400" font-family="DejaVu Sans Mono, monospace">  if (!modoRPM) return;</text><text xml:space="preserve" x="103" y="328.42105263157896" font-size="19" fill="#7e98b0" font-weight="400" font-family="DejaVu Sans Mono, monospace">37</text><text xml:space="preserve" x="170" y="328.42105263157896" font-size="24" fill="#eaf1fa" font-weight="400" font-family="DejaVu Sans Mono, monospace"></text><text xml:space="preserve" x="103" y="362.63157894736844" font-size="19" fill="#7e98b0" font-weight="400" font-family="DejaVu Sans Mono, monospace">38</text><text xml:space="preserve" x="170" y="362.63157894736844" font-size="24" fill="#eaf1fa" font-weight="400" font-family="DejaVu Sans Mono, monospace">  float erro = rpmDesejado - rpmAtual;</text><text xml:space="preserve" x="103" y="396.8421052631579" font-size="19" fill="#7e98b0" font-weight="400" font-family="DejaVu Sans Mono, monospace">39</text><text xml:space="preserve" x="170" y="396.8421052631579" font-size="24" fill="#eaf1fa" font-weight="400" font-family="DejaVu Sans Mono, monospace"></text><text xml:space="preserve" x="103" y="431.0526315789474" font-size="19" fill="#7e98b0" font-weight="400" font-family="DejaVu Sans Mono, monospace">40</text><text xml:space="preserve" x="170" y="431.0526315789474" font-size="24" fill="#eaf1fa" font-weight="400" font-family="DejaVu Sans Mono, monospace">  // A leitura de 1 pulso/volta em janelas de 1 s tem passos de ~60 RPM.</text><text xml:space="preserve" x="103" y="465.2631578947368" font-size="19" fill="#7e98b0" font-weight="400" font-family="DejaVu Sans Mono, monospace">41</text><text xml:space="preserve" x="170" y="465.2631578947368" font-size="24" fill="#eaf1fa" font-weight="400" font-family="DejaVu Sans Mono, monospace">  if (rpmAtual &gt; 0 &amp;&amp; erro &gt;= -MARGEM_RPM &amp;&amp; erro &lt;= MARGEM_RPM) return;</text><text xml:space="preserve" x="103" y="499.4736842105263" font-size="19" fill="#7e98b0" font-weight="400" font-family="DejaVu Sans Mono, monospace">42</text><text xml:space="preserve" x="170" y="499.4736842105263" font-size="24" fill="#eaf1fa" font-weight="400" font-family="DejaVu Sans Mono, monospace"></text><text xml:space="preserve" x="103" y="533.6842105263158" font-size="19" fill="#7e98b0" font-weight="400" font-family="DejaVu Sans Mono, monospace">43</text><text xml:space="preserve" x="170" y="533.6842105263158" font-size="24" fill="#eaf1fa" font-weight="400" font-family="DejaVu Sans Mono, monospace">  float ajuste = erro * GANHO_RPM;</text><text xml:space="preserve" x="103" y="567.8947368421052" font-size="19" fill="#7e98b0" font-weight="400" font-family="DejaVu Sans Mono, monospace">44</text><text xml:space="preserve" x="170" y="567.8947368421052" font-size="24" fill="#eaf1fa" font-weight="400" font-family="DejaVu Sans Mono, monospace">  if (rpmAtual == 0) ajuste = AJUSTE_MAXIMO_POR_SEGUNDO;</text><text xml:space="preserve" x="103" y="602.1052631578948" font-size="19" fill="#7e98b0" font-weight="400" font-family="DejaVu Sans Mono, monospace">45</text><text xml:space="preserve" x="170" y="602.1052631578948" font-size="24" fill="#eaf1fa" font-weight="400" font-family="DejaVu Sans Mono, monospace">  ajuste = constrain(ajuste, -AJUSTE_MAXIMO_POR_SEGUNDO,</text><text xml:space="preserve" x="103" y="636.3157894736842" font-size="19" fill="#7e98b0" font-weight="400" font-family="DejaVu Sans Mono, monospace">46</text><text xml:space="preserve" x="170" y="636.3157894736842" font-size="24" fill="#eaf1fa" font-weight="400" font-family="DejaVu Sans Mono, monospace">                     AJUSTE_MAXIMO_POR_SEGUNDO);</text><text xml:space="preserve" x="103" y="670.5263157894736" font-size="19" fill="#7e98b0" font-weight="400" font-family="DejaVu Sans Mono, monospace">47</text><text xml:space="preserve" x="170" y="670.5263157894736" font-size="24" fill="#eaf1fa" font-weight="400" font-family="DejaVu Sans Mono, monospace"></text><text xml:space="preserve" x="103" y="704.7368421052631" font-size="19" fill="#7e98b0" font-weight="400" font-family="DejaVu Sans Mono, monospace">48</text><text xml:space="preserve" x="170" y="704.7368421052631" font-size="24" fill="#eaf1fa" font-weight="400" font-family="DejaVu Sans Mono, monospace">  controlePWM += ajuste * (intervalo / 1000.0f);</text><text xml:space="preserve" x="103" y="738.9473684210526" font-size="19" fill="#7e98b0" font-weight="400" font-family="DejaVu Sans Mono, monospace">49</text><text xml:space="preserve" x="170" y="738.9473684210526" font-size="24" fill="#eaf1fa" font-weight="400" font-family="DejaVu Sans Mono, monospace">  controlePWM = constrain(controlePWM, 0.0f, 100.0f);</text><text xml:space="preserve" x="103" y="773.1578947368421" font-size="19" fill="#7e98b0" font-weight="400" font-family="DejaVu Sans Mono, monospace">50</text><text xml:space="preserve" x="170" y="773.1578947368421" font-size="24" fill="#eaf1fa" font-weight="400" font-family="DejaVu Sans Mono, monospace">  int novoPercentual = (int)(controlePWM + 0.5f);</text><text xml:space="preserve" x="103" y="807.3684210526316" font-size="19" fill="#7e98b0" font-weight="400" font-family="DejaVu Sans Mono, monospace">51</text><text xml:space="preserve" x="170" y="807.3684210526316" font-size="24" fill="#eaf1fa" font-weight="400" font-family="DejaVu Sans Mono, monospace"></text><text xml:space="preserve" x="103" y="841.578947368421" font-size="19" fill="#7e98b0" font-weight="400" font-family="DejaVu Sans Mono, monospace">52</text><text xml:space="preserve" x="170" y="841.578947368421" font-size="24" fill="#eaf1fa" font-weight="400" font-family="DejaVu Sans Mono, monospace">  if (novoPercentual != potencia) ajustarVelocidade(novoPercentual);</text><text xml:space="preserve" x="103" y="875.7894736842105" font-size="19" fill="#7e98b0" font-weight="400" font-family="DejaVu Sans Mono, monospace">53</text><text xml:space="preserve" x="170" y="875.7894736842105" font-size="24" fill="#eaf1fa" font-weight="400" font-family="DejaVu Sans Mono, monospace">}</text><text xml:space="preserve" x="70" y="1016" font-size="22" fill="#5b6d80" font-weight="400">Fonte: firmware/Ventoinha_Percentual_RPM/Ventoinha_Percentual_RPM.ino · linhas 35–53</text></g></svg>