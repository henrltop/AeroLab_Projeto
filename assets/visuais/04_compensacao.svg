<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>Como o erro corrige o acionamento</title><rect width="1920" height="1080" fill="#f5f7fb"/><g font-family="DejaVu Sans, sans-serif"><text xml:space="preserve" x="70" y="90" font-size="46" fill="#172b43" font-weight="700">Como o erro corrige o acionamento</text><text xml:space="preserve" x="70" y="142" font-size="24" fill="#5b6d80" font-weight="400">EXEMPLO DIDÁTICO · valores ilustrativos, sem dados experimentais</text><rect x="70" y="225" width="540" height="210" rx="22" fill="#fff7ed" stroke="#f0d3b5" stroke-width="2"/><text xml:space="preserve" x="110" y="285" font-size="25" fill="#c66a16" font-weight="700">DESEJADO · SETPOINT</text><text xml:space="preserve" x="110" y="378" font-size="64" fill="#c66a16" font-weight="700">2000 RPM</text><rect x="690" y="225" width="540" height="210" rx="22" fill="#eff6ff" stroke="#c8dbed" stroke-width="2"/><text xml:space="preserve" x="730" y="285" font-size="25" fill="#2478c8" font-weight="700">MEDIDO</text><text xml:space="preserve" x="730" y="378" font-size="64" fill="#2478c8" font-weight="700">1600 RPM</text><rect x="1310" y="225" width="540" height="210" rx="22" fill="white" stroke="#d8e0eb" stroke-width="2"/><text xml:space="preserve" x="1350" y="285" font-size="22" fill="#5b6d80" font-weight="700">ERRO = DESEJADO − MEDIDO</text><text xml:space="preserve" x="1350" y="378" font-size="60" fill="#172b43" font-weight="700">+400 RPM</text><g id="calculo"><text xml:space="preserve" x="960" y="550" font-size="43" fill="#8656b9" font-weight="700" text-anchor="middle">400 × 0,005 = +2 pontos percentuais/s</text><text xml:space="preserve" x="960" y="625" font-size="37" fill="#172b43" font-weight="600" text-anchor="middle">Após 1 s: PWM de 50% → 52%</text></g><rect x="230" y="710" width="1460" height="185" rx="22" fill="white" stroke="#d8e0eb" stroke-width="2"/><text xml:space="preserve" x="280" y="770" font-size="31" fill="#172b43" font-weight="400">Abaixo do alvo: aumenta PWM. Acima do alvo: diminui PWM.</text><text xml:space="preserve" x="280" y="832" font-size="27" fill="#5b6d80" font-weight="400">Margem ±60 RPM · Correção máxima ±5 p.p./s · Saída entre 0 e 100%</text><text xml:space="preserve" x="70" y="1016" font-size="22" fill="#5b6d80" font-weight="400">O ganho é um ajuste do controlador. A mesma mudança de PWM não garante uma mudança fixa de RPM.</text></g></svg>