<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>Três variáveis, três leituras</title><rect width="1920" height="1080" fill="#f5f7fb"/><g font-family="DejaVu Sans, sans-serif"><text xml:space="preserve" x="70" y="90" font-size="46" fill="#172b43" font-weight="700">Três variáveis, três leituras</text><text xml:space="preserve" x="70" y="142" font-size="24" fill="#5b6d80" font-weight="400">As cores seguem o painel AeroLab incluído neste pacote</text><rect x="70" y="220" width="1780" height="690" rx="22" fill="white" stroke="#d8e0eb" stroke-width="2"/><polyline points="130,360 420,360" fill="none" stroke="#c66a16" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><text xml:space="preserve" x="480" y="370" font-size="41" fill="#c66a16" font-weight="700">RPM desejado</text><text xml:space="preserve" x="480" y="427" font-size="27" fill="#5b6d80" font-weight="400">Referência principal · eixo esquerdo</text><polyline points="130,555 420,555" fill="none" stroke="#2478c8" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text xml:space="preserve" x="480" y="565" font-size="41" fill="#2478c8" font-weight="700">RPM medido</text><text xml:space="preserve" x="480" y="622" font-size="27" fill="#5b6d80" font-weight="400">Velocidade calculada pelo sensor · eixo esquerdo</text><polyline points="130,750 420,750" fill="none" stroke="#8656b9" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="2 15"/><text xml:space="preserve" x="480" y="760" font-size="41" fill="#8656b9" font-weight="700">PWM aplicado</text><text xml:space="preserve" x="480" y="817" font-size="27" fill="#5b6d80" font-weight="400">Percentual de acionamento · eixo direito, 0–100%</text><text xml:space="preserve" x="70" y="1016" font-size="22" fill="#5b6d80" font-weight="400">Legenda, sem série de dados. A demonstração real deve vir da interface conectada ao ESP32.</text></g></svg>